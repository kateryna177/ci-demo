image: python:3.12

stages:
  - lint
  - test

lint:
  stage: lint
  script:
    - pip install -r requirements.txt
    - flake8 .

unit-tests:
  stage: test
  script:
    - pip install -r requirements.txt
    - pytest --cov=app --cov-fail-under=80 --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
